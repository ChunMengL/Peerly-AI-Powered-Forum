<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="./login.css" />
</head>
<body>
    <main class="login-card">
        <h1>Welcome Back</h1>
        <p class="subtitle">Sign in to continue</p>

        <form action="#" method="post">
            <div class="field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" placeholder="you@example.com" required />
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="Enter your password" required />
            </div>

            <div class="actions">
                <button class="btn-primary" type="submit">Login</button>
                <button class="btn-secondary" type="button">Sign Up / Register</button>
                <button class="btn-text" type="button">Forgot Password?</button>
            </div>
        </form>

        <div class="divider">or continue with SSO</div>

        <div class="sso">
            <button type="button">Continue with Gmail</button>
            <button type="button">Continue with Outlook</button>
        </div>
    </main>
</body>
</html>
