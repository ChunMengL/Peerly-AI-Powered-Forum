<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="icon" type="image/png" href="/Images/peerly_logo.png" />
    <link rel="stylesheet" href="./login.css" />
  </head>
  <body>
    <main class="auth-shell">
      <section class="auth-card">
        <section class="form-side" aria-live="polite">
          <div class="form-content">
            <a
              class="brand"
              href="/"
              aria-label="Back to Peerly home"
              data-tooltip="Go to home"
            >
              <span class="mark" aria-hidden="true">
                <img src="./Peerly_Logo_Icon.svg" alt="" />
              </span>
              <span class="name">Peerly</span>
            </a>

            <h1 id="formTitle">Sign In</h1>
            <p class="hint" id="formHint">
              Use your account or continue with Google.
            </p>

            <div class="social-row" aria-label="Social providers">
              <button
                class="social"
                type="button"
                title="Facebook is not available yet"
                disabled
              >
                f
              </button>
              <button
                class="social"
                type="button"
                id="googleSsoButton"
                title="Continue with Google"
              >
                <img class="social-icon" src="/Images/google.png" alt="" />
              </button>
              <button
                class="social"
                type="button"
                title="LinkedIn is not available yet"
                disabled
              >
                <img class="social-icon" src="./LinkedIn_Logo.svg" alt="" />
              </button>
            </div>

            <p class="subline" id="sublineText">or use your email account</p>

            <form id="emailForm" action="#" method="post" novalidate>
              <div class="field" id="fullNameField" hidden>
                <label for="fullName">Full Name</label>
                <input
                  id="fullName"
                  name="fullName"
                  type="text"
                  placeholder="Full Name"
                  autocomplete="name"
                />
              </div>

              <div class="field">
                <label for="email">Email Address</label>
                <input
                  id="email"
                  name="email"
                  type="email"
                  placeholder="you@example.com"
                  autocomplete="email"
                  required
                />
              </div>

              <div class="field">
                <label for="password">Password</label>
                <input
                  id="password"
                  name="password"
                  type="password"
                  placeholder="Enter your password"
                  autocomplete="current-password"
                  required
                />
              </div>

              <button class="text-link" id="forgotButton" type="button">
                Forgot your password?
              </button>

              <div class="actions">
                <button class="btn-primary" id="submitButton" type="submit">
                  Sign In
                </button>
              </div>
            </form>

            <p class="auth-status" id="authStatus" hidden></p>
          </div>
        </section>

        <aside class="promo-side">
          <div class="promo-content">
            <h2 id="promoTitle">Hey There!</h2>
            <p id="promoText">
              Begin your learning journey by creating an account with Peerly
              today.
            </p>
            <button class="btn-outline" id="switchModeButton" type="button">
              Sign Up
            </button>
          </div>
        </aside>
      </section>
    </main>
    <script src="./login.js"></script>
  </body>
</html>
